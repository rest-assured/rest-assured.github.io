# Runs on every pull request, the same check as you run locally: it tests the scripts in site/, builds the site (which
# fails on a broken internal link), checks that every old rest-assured.io address and every wiki page, anchor and code
# block still has a place on the site, and that CNAME names rest-assured.io.
name: Check

on:
  pull_request:

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - run: npm run check
