# Builds the new site in site/ and publishes it to GitHub Pages. For now it only runs when started by hand from the
# Actions tab, so merging changes nothing on rest-assured.io. To go live:
#
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   2. Actions > Deploy site > Run workflow, on master.
#   3. Check that Settings > Pages still shows rest-assured.io with HTTPS, and open https://rest-assured.io.
#
# To roll back, set the source back to "Deploy from a branch" (master, / (root)). The Jekyll site is still there.
# Once the new site has run for a few days, a follow-up change removes the Jekyll files and makes this workflow run on
# every push to master.
name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      # The same check as on pull requests: tests, build, links, old addresses, CNAME, and every wiki page, anchor and
      # code block on the site.
      - run: npm run check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
